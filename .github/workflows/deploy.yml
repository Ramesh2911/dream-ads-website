name: Deploy website to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write runtime env + deploy marker
        run: |
          printf 'SITE_URL=https://dreamads.in\nBACKEND_URL=http://127.0.0.1:5000\nINQUIRY_WEBHOOK_URL=\n' > .env.local
          printf '%s' "$GITHUB_RUN_ID" > public/_deploy-marker.txt

      - name: Build
        run: npm run build

      - name: Deploy via cPanel API
        env:
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_SSO_EMAIL: ${{ secrets.CPANEL_SSO_EMAIL }}
          CPANEL_SSO_PASSWORD: ${{ secrets.CPANEL_SSO_PASSWORD }}
        run: bash scripts/cpanel-deploy.sh
